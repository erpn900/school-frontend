<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard – SchoolMS</title>
  <link rel="stylesheet" href="../css/style.css">
  <script>window.BACKEND_URL = 'https://script.google.com/macros/s/AKfycbz42jbxkFCmq0F9F8jo7kka9PuYraYBO8vU1z0FSkVRxmHVt069gy9JYdP06K5-vrECRw/exec';</script>
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>

  <div class="main-content">
    <header class="top-header">
      <button class="menu-toggle" id="menu-toggle">☰</button>
      <div class="header-search">
        <span>🔍</span>
        <input type="text" placeholder="Search…" id="search-input">
      </div>
      <div class="header-right">
        <div class="user-badge" id="user-info"></div>
      </div>
    </header>

    <main class="page-content">
      <div class="page-header">
        <h1 class="page-title">Dashboard</h1>
        <span class="text-muted text-sm" id="date-label"></span>
      </div>

      <!-- Stats Grid -->
      <div class="stat-grid" id="stat-grid">
        <div class="loading">Loading statistics…</div>
      </div>

      <!-- Two-column grid -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px" class="two-col">

        <!-- Recent Announcements -->
        <div class="card">
          <div class="flex items-center gap-2 mb-4" style="justify-content:space-between">
            <h2 style="font-size:1rem;font-weight:700">Announcements</h2>
            <a href="announcements.html" class="btn btn-ghost btn-sm">View all</a>
          </div>
          <div id="announcements-list"><div class="loading">Loading…</div></div>
        </div>

        <!-- Upcoming Events -->
        <div class="card">
          <div class="flex items-center gap-2 mb-4" style="justify-content:space-between">
            <h2 style="font-size:1rem;font-weight:700">Upcoming Events</h2>
            <a href="events.html" class="btn btn-ghost btn-sm">View all</a>
          </div>
          <div id="events-list"><div class="loading">Loading…</div></div>
        </div>

      </div><!-- /two-col -->

    </main>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/sidebar.js"></script>
<script>
  initLayout(['admin']);
  document.getElementById('date-label').textContent = new Date().toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

  const STAT_DEFS = [
    { key:'students',      label:'Students',      icon:'🎒', cls:'sky'    },
    { key:'teachers',      label:'Teachers',      icon:'👩‍🏫', cls:'purple' },
    { key:'parents',       label:'Parents',       icon:'👨‍👩‍👧', cls:'yellow' },
    { key:'classes',       label:'Classes',       icon:'🏛️', cls:'sky'    },
    { key:'subjects',      label:'Subjects',      icon:'📚', cls:'purple' },
    { key:'lessons',       label:'Lessons',       icon:'📖', cls:'yellow' },
    { key:'exams',         label:'Exams',         icon:'📝', cls:'sky'    },
    { key:'announcements', label:'Announcements', icon:'📢', cls:'purple' },
  ];

  async function loadStats() {
    try {
      const stats = await API.getDashboardStats();
      document.getElementById('stat-grid').innerHTML = STAT_DEFS.map(d => `
        <div class="stat-card ${d.cls}">
          <div class="stat-icon">${d.icon}</div>
          <div class="stat-value">${stats[d.key] ?? 0}</div>
          <div class="stat-label">${d.label}</div>
        </div>`).join('');
    } catch (e) { toast(e.message, 'error'); }
  }

  async function loadAnnouncements() {
    try {
      const res = await API.getAnnouncements({ limit: 5 });
      const el  = document.getElementById('announcements-list');
      if (!res.data.length) { el.innerHTML = '<p class="empty-state">No announcements yet.</p>'; return; }
      el.innerHTML = res.data.map(a => `
        <div style="padding:10px 0;border-bottom:1px solid var(--border)">
          <div style="font-weight:600;font-size:.9rem">${a.title}</div>
          <div class="text-sm text-muted">${a.description || ''}</div>
          <div class="text-sm text-muted" style="margin-top:4px">${fmtDate(a.date)}</div>
        </div>`).join('');
    } catch (_) {}
  }

  async function loadEvents() {
    try {
      const res = await API.getEvents({ limit: 5 });
      const el  = document.getElementById('events-list');
      if (!res.data.length) { el.innerHTML = '<p class="empty-state">No events yet.</p>'; return; }
      el.innerHTML = res.data.map(ev => `
        <div style="padding:10px 0;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start">
          <div style="background:var(--sky);border-radius:8px;padding:6px 10px;text-align:center;min-width:48px">
            <div style="font-size:.7rem;font-weight:600;color:#0369a1">${new Date(ev.startTime).toLocaleDateString('en-US',{month:'short'})}</div>
            <div style="font-size:1.2rem;font-weight:700;line-height:1">${new Date(ev.startTime).getDate() || '—'}</div>
          </div>
          <div>
            <div style="font-weight:600;font-size:.9rem">${ev.title}</div>
            <div class="text-sm text-muted">${ev.description || ''}</div>
          </div>
        </div>`).join('');
    } catch (_) {}
  }

  loadStats();
  loadAnnouncements();
  loadEvents();
</script>
</body>
</html>
